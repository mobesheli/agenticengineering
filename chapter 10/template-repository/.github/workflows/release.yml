name: release
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evaluation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m chapter10.pipeline --repo template-repository --mode "$GATE_MODE"
        env:
          GATE_MODE: ${{ vars.GATE_MODE }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-record
          path: template-repository/results/release-record.json

name: chapter-10-release-gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install companion dependencies
        run: python -m pip install -r "chapter 10/requirements.txt"
      - name: Run the locally reproducible gate
        run: |
          cd "chapter 10"
          python -m chapter10 --pipeline-only --gate-mode block --output-dir artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: chapter-10-gate-results
          path: chapter 10/artifacts/pipeline-report.json

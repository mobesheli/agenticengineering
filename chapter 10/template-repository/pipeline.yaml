stages: [floor, gate, package, release]

evaluation-gate:
  stage: gate
  script:
    - python -m chapter10.pipeline --repo . --mode "$GATE_MODE"
  variables:
    GATE_MODE: block
  artifacts: [results/release-record.json]

package:
  stage: package
  script:
    - build --sbom --provenance --sign
  requires: [evaluation-gate]

release:
  stage: release
  script:
    - release canary --plant plant-2 --bundle bundle.yaml
  requires: [package]
